name: Validate Radian

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run lint
          npm run lint:functions
          npm test -- --run
          node --test scripts/smoke-policy-check.mjs
          node --test mcp/radian-mcp.smoke.mjs
          git diff --check

      - name: Build
        run: npm run build

      - name: Build Pages Functions
        run: npx wrangler pages functions build functions

      - name: Smoke test production
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          RADIAN_SMOKE_URL: https://radian-cku.pages.dev
          RADIAN_PUBLIC_ORIGIN: https://radian.nidr0x.win
        run: |
          for attempt in $(seq 1 12); do
            set +e
            npm run smoke:prod
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -eq 2 ]; then
              echo "::error title=Production smoke blocked by Cloudflare::The runner received a Cloudflare perimeter 403, so the production smoke could not run. Allow-list the GitHub runner IP in Cloudflare or provide RADIAN_SMOKE_URL reaching the origin directly; do not merge as fully validated until a green run exists."
              exit 1
            fi
            sleep 10
          done
          echo "Production smoke test failed after 120 seconds."
          exit 1

  report-production-deployment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    environment:
      name: production
      url: https://radian.nidr0x.win
    steps:
      - name: Record verified production deployment
        run: echo "Production Pages deployment passed its smoke test."
