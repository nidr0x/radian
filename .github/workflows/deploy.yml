name: Validate Radian

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radian-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run lint
          npm run lint:functions
          npm test -- --run
          node --test scripts/smoke-policy-check.mjs
          git diff --check

      - name: Build
        run: npm run build

      - name: Build Pages Functions
        run: npx wrangler pages functions build functions

      - name: Smoke test production
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          for attempt in $(seq 1 12); do
            set +e
            npm run smoke:prod
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -eq 2 ]; then
              echo "::warning title=Production smoke blocked by Cloudflare::The public endpoint is healthy outside GitHub Actions, but the runner received a Cloudflare perimeter 403."
              exit 0
            fi
            sleep 10
          done
          echo "Production smoke test failed after 120 seconds."
          exit 1
